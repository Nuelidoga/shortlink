apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink-api
  labels:
    app.kubernetes.io/name: shortlink-api
    {{- include "shortlink.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: shortlink-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # zero-downtime: start the new pod before stopping the old one
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortlink-api
        {{- include "shortlink.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the "node" user in the node:22-alpine image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/shortlink-api:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: DB_NAME
              value: {{ .Values.api.database.name | quote }}
            - name: DB_PORT
              value: {{ .Values.api.database.port | quote }}
            - name: DB_SSL
              value: {{ .Values.api.database.ssl | quote }}
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.database.secretName }}
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.database.secretName }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.database.secretName }}
                  key: DB_PASSWORD
          readinessProbe: # ready to receive traffic? (checks the database)
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe: # still alive? (restarts the container if not)
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "shortlink.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shortlink-api
  labels:
    app.kubernetes.io/name: shortlink-api
    {{- include "shortlink.labels" . | nindent 4 }}
spec:
  type: ClusterIP # internal only, not reachable from the internet
  selector:
    app.kubernetes.io/name: shortlink-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shortlink-api
  labels:
    app.kubernetes.io/name: shortlink-api
    {{- include "shortlink.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shortlink-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
