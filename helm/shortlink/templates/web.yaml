apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink-web
  labels:
    app.kubernetes.io/name: shortlink-web
    {{- include "shortlink.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: shortlink-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortlink-web
        {{- include "shortlink.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # the "nginx" user in the nginx-unprivileged image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/shortlink-frontend:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: API_URL
              value: "http://shortlink-api:{{ .Values.api.port }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "shortlink.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # Nginx needs a few writable folders; the rest of the filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shortlink-web
  labels:
    app.kubernetes.io/name: shortlink-web
    {{- include "shortlink.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shortlink-web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
