{{- if .Values.gateway.enabled }}
# Gateway API: the modern replacement for Ingress.
# The Gateway is the entry point (gets a public IP); the HTTPRoute says where traffic goes.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shortlink
  labels:
    {{- include "shortlink.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shortlink
  labels:
    {{- include "shortlink.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: shortlink
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shortlink-web
          port: {{ .Values.web.port }}
{{- end }}
