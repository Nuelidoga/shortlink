<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShortLink</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <h1>ShortLink</h1>
      <p class="tagline">Paste a long URL and get a short one back.</p>
    </header>

    <form id="shorten-form" autocomplete="off">
      <input id="url-input" type="url" placeholder="https://example.com/a/very/long/link" required>
      <button type="submit">Shorten</button>
    </form>

    <p id="error" class="error" hidden></p>

    <div id="result" class="result" hidden>
      <span>Your short link:</span>
      <a id="short-url" href="#" target="_blank" rel="noopener"></a>
      <button id="copy-btn" type="button" class="secondary">Copy</button>
    </div>

    <section>
      <h2>Recent links</h2>
      <table>
        <thead>
          <tr><th>Short link</th><th>Original URL</th><th class="num">Clicks</th></tr>
        </thead>
        <tbody id="links-body">
          <tr><td colspan="3" class="muted">Loading…</td></tr>
        </tbody>
      </table>
    </section>

    <footer class="muted">Running on Azure Kubernetes Service</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
